<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agwmap</title>
<style>
/* A dark blueprint: flat panels on a grid, one accent colour per kind of object and of setting. */
:root{
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font:"Avenir Next","Segoe UI",system-ui,sans-serif; --radius:2px; --shadow:3px 3px 0 #2a2340;
  --bg:#130f1b; --grid:#1a1526; --panel:#1b1727; --soft:#27243d; --ink:#edeef7; --mut:#a3a6ba;
  --line:#5c5478; --hair:color-mix(in srgb,var(--line) 55%,transparent);
  --accent:#6a45c4; --key:#b9a2ee; --onaccent:#fff;
  --gateway:#6fb9dc; --route:#b09be0; --backend:#8f99d8; --policy:#d98aa8; --external:#8b8e9d;
  --authn:#7cc9a4; --authz:#6dbdb4; --ratelimit:#dcb47a; --guardrails:#d98aa8; --transform:#b09be0;
  --resilience:#6fb9dc; --identity:#86cfc4; --security:#8f99d8; --observability:#a3a6ba;
  --extension:#d49ab8; --connection:#a3a6ba; --other:#a3a6ba; --ok:#7cc9a4; --bad:#e08aa6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:13px/1.45 var(--font);background:var(--bg);background-size:24px 24px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
button,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;box-shadow:0 2px 0 #2a2340}
header h1{font-family:var(--mono);font-size:1.15em;margin:0;text-transform:uppercase;letter-spacing:.12em}
header .meta{color:var(--mut);font-size:.92em}
.tabs{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tabs button{border:0;background:none;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.tabs button:last-child{border-right:0}
.tabs button.on{background:color-mix(in srgb,var(--accent) 55%,var(--panel));color:var(--onaccent)}
#q{min-width:200px;margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--gateway)}
.state{font-size:.88em;border-radius:var(--radius);padding:2px 9px;border:1px solid var(--ok);color:var(--ok)}
.state.raw{border-color:var(--bad);color:var(--bad)}
main{padding:16px}
.warn{background:color-mix(in srgb,var(--ratelimit) 14%,var(--panel));border:1px solid var(--ratelimit);
  border-radius:var(--radius);padding:8px 12px;margin-bottom:12px}
.mut{color:var(--mut)} .mono{font-family:var(--mono);font-size:.92em}
.empty{color:var(--mut);font-style:italic}
[data-open]{cursor:pointer}
.tag{display:inline-block;padding:0 7px;border:1px solid color-mix(in srgb,var(--c,var(--other)) 60%,var(--panel));border-radius:var(--radius);
  font-family:var(--mono);font-size:.85em;line-height:16px;white-space:nowrap;color:var(--c,var(--ink));
  background:color-mix(in srgb,var(--c,var(--other)) 10%,var(--panel))}
.badge{font-size:.8em;border:1px solid var(--line);border-radius:var(--radius);padding:0 5px;color:var(--mut)}
pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;overflow:auto;
  font-family:var(--mono);font-size:.88em;line-height:1.5}
pre .y{color:var(--key)}

.flowwrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;position:sticky;top:calc(var(--hh,48px) + 16px);
  max-height:calc(100vh - var(--hh,48px) - 36px);overflow:auto;box-shadow:var(--shadow)}
/* Narrow windows: one column, and nothing sticks, so the header cannot cover the page. */
@media (max-width:800px){
  header{position:static}
  .flowwrap{grid-template-columns:minmax(0,1fr)}
  .tree{position:static;max-height:45vh}
}
.tree .g{font-weight:600;padding:5px 6px;cursor:pointer;display:flex;gap:6px;align-items:baseline;border-radius:var(--radius);user-select:none}
.tree .g:hover{background:var(--soft)}
.tree .g .caret{color:var(--key);width:16px;flex:none;font-size:1.35em;line-height:1;align-self:center}
.tree .g .n{margin-left:auto;color:var(--mut);font-weight:400;font-family:var(--mono);font-size:.85em}
.tree .l{padding:6px 6px 2px 14px;color:var(--mut);font-family:var(--mono);font-size:.88em}
.tree .r{padding:4px 6px 4px 24px;border-radius:calc(var(--radius) - 1px);cursor:pointer}
.tree .r:hover{background:var(--soft)}
.tree .r.on{background:color-mix(in srgb,var(--accent) 45%,var(--panel));color:var(--onaccent);box-shadow:inset 3px 0 0 var(--key)}
.tree .r small{display:block;opacity:.75;font-family:var(--mono);font-size:.85em;word-break:break-all}
.flow{max-width:900px}
.stage{position:relative;padding:0 0 18px 30px;border-left:1px solid var(--line);margin-left:11px}
.stage:last-child{border-left-color:transparent}
.stage>.dot{position:absolute;left:-11.5px;top:0;width:22px;height:22px;border:1px solid var(--sc,var(--line));border-radius:var(--radius);
  background:color-mix(in srgb,var(--sc,var(--mut)) 14%,var(--bg));color:var(--sc,var(--ink));font-size:11px;font-weight:700;display:grid;place-items:center}
.stage>h4{margin:0 0 6px;font-family:var(--mono);font-size:.85em;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);line-height:22px}
.card{background:var(--panel);border:1px solid var(--line);border-left-color:var(--rc,var(--line));border-radius:var(--radius);
  margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
.card:hover{border-color:var(--key);box-shadow:4px 4px 0 var(--accent)}
.card .t{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:6px 12px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--rc,var(--mut)) 13%,var(--panel))}
.card .t:last-child{border-bottom:0}
.card .t .st{font-family:var(--mono);font-size:.85em;color:var(--rc,var(--ink))}
.card .t b{font-size:1.04em}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 10px;margin:8px 12px;font-family:var(--mono);font-size:.88em}
.kv span:nth-child(odd){color:var(--mut)}
.kv span{word-break:break-all}
.feat{padding:8px 12px;border-top:1px dashed var(--hair)}
.t+.feat{border-top:0}
.feat .fh{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.feat .fh .sv{font-family:var(--mono);font-size:.88em}
.feat pre{border-color:var(--hair);cursor:text}
.feat summary{cursor:pointer;color:var(--mut);font-family:var(--mono);font-size:.88em;padding:2px 0 4px}
.branch{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px 2px;margin-bottom:10px;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.branch>h5{margin:0 0 8px;font-size:.92em}
.sub{margin-left:22px}
.uses{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;margin:-2px 0 10px 12px;font-size:.88em}
.uses .ct{color:var(--mut);font-size:.9em;text-transform:uppercase;letter-spacing:.06em}
.chip{border:1px dashed var(--line);border-radius:2px;padding:1px 7px;font-family:var(--mono);background:var(--panel)}
.chip:hover{border-color:var(--key)}
.chip .k{color:var(--mut)}
.chip .badge{margin-left:6px}
.badge.bad{border-color:var(--bad);color:var(--bad)}
.badge.go{border-color:var(--gateway);color:var(--gateway)}
.badge.also{border-color:var(--ratelimit);color:var(--ratelimit);margin-left:auto}
.feat.filter{margin:0 0 8px;padding:0 0 8px;border-top:0;border-bottom:1px dashed var(--hair)}

.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 10px;border-bottom:1px solid var(--hair);vertical-align:top;text-align:left}
th{background:var(--soft);font-size:.85em;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
tr.grp td{background:var(--soft);font-weight:600}
tr.grp td span{font-weight:400;color:var(--mut);margin-left:6px}
tbody tr[data-open]:hover{background:var(--soft)}
td.num{text-align:right;font-family:var(--mono);font-size:.92em;color:var(--mut)}
.ok{color:var(--ok)} .no{color:var(--bad)}
.rawbar{display:flex;gap:12px;align-items:center;margin-bottom:10px}
#rawtext{background:var(--panel);padding:12px 14px;white-space:pre;font-size:.92em}

#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--panel);border-left:1px solid var(--line);
  box-shadow:-4px 0 0 #2a2340;z-index:40;display:none;flex-direction:column}
#drawer.on{display:flex}
#drawer .dh{padding:12px 16px;border-bottom:1px solid var(--line);border-top:3px solid var(--rc,var(--external))}
#drawer .dh .st{font-family:var(--mono);font-size:.88em;color:var(--rc,var(--mut))}
#drawer .dh h2{margin:2px 0 0;font-size:1.3em;word-break:break-word}
#drawer .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--mut)}
#drawer .db{overflow:auto;padding:12px 16px;flex:1}
#drawer h3{font-size:.85em;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 6px}
#drawer h3:first-child{margin-top:0}
.feats{display:flex;flex-wrap:wrap;gap:6px 12px}
.rel{display:flex;gap:8px;align-items:baseline;padding:3px 6px;border-radius:5px}
.rel:hover{background:var(--soft)}
.rel .ty{font-size:.8em;color:var(--mut);width:60px;flex:none;text-transform:uppercase;letter-spacing:.04em}
.rel .k{font-family:var(--mono);font-size:.85em;color:var(--mut)}
.cond{font-family:var(--mono);font-size:.88em;padding:2px 0}
.copy{float:right;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:1px 8px;cursor:pointer;font-size:.85em}

</style>
</head>
<body>
<header>
  <h1>agwmap</h1>
  <span class="meta" id="meta"></span>
  <span class="state" id="state"></span>
  <div class="tabs" id="tabs">
    <button data-v="flow">Request flow</button>
    <button data-v="resources">Resources</button>
    <button data-v="outside">Outside the flow</button>
    <button data-v="raw">Raw</button>
  </div>
  <input id="q" type="search" placeholder="Filter by name, namespace, host…">
  <button class="btn" id="export" title="Download the captured objects as a snapshot file. Render it again with: agwmap -from FILE">Export snapshot</button>
</header>
<main><div id="warn"></div><div id="view"></div></main>
<aside id="drawer"></aside>
<script id="data" type="application/json">__GWMAP_DATA__</script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const push = (m, k, x) => { const a = m.get(k); a ? a.push(x) : m.set(k, [x]); }; // add to a Map of lists
const D = JSON.parse($("data").textContent);
// The header wraps when it runs out of width; what sticks below it follows its height.
new ResizeObserver(([e]) => document.documentElement.style.setProperty("--hh", e.target.offsetHeight + "px"))
  .observe(document.querySelector("header"));
const N = new Map(D.nodes.map(n => [n.id, n]));
const OUT = new Map(), IN = new Map();
for (const e of D.edges) { push(OUT, e.from, e); push(IN, e.to, e); }
const outE = id => OUT.get(id) || [], inE = id => IN.get(id) || [];
const byRole = r => D.nodes.filter(n => n.role === r);
const spec = n => (n.obj && n.obj.spec) || {};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get = (o, path) => path.split(".").reduce((a, k) => a == null ? a : a[k], o);
const CAT = {authn:"AuthN", authz:"AuthZ", ratelimit:"Rate limit", guardrails:"Guardrails", transform:"Transform",
  identity:"Identity", resilience:"Resilience", security:"TLS / CORS", observability:"Observability",
  extension:"Extensions", connection:"Connection", other:"Other"};
const tag = f => `<span class="tag" style="--c:var(--${f.cat})">${esc(CAT[f.cat])}</span>`;
const rc = n => `--rc:var(--${["gateway","route","backend","policy"].includes(n.role) ? n.role : n.role === "listenerset" ? "gateway" : "external"})`;

/* ---------- model ---------- */
const gateways = byRole("gateway"), routes = byRole("route");
// policies attached to an object: [{p, section}]
const polsOn = id => inE(id).filter(e => e.type === "target").map(e => ({p: N.get(e.from), section: e.section || ""}));
// listener sets that add listeners to a gateway
const listenerSets = g => inE(g.id).filter(e => e.type === "parent" && N.get(e.from).role === "listenerset").map(e => N.get(e.from));
// every listener of a gateway: its own and those of its listener sets: [{l, via}]
const listenersOf = g => [...(spec(g).listeners || []).map(l => ({l, via: null})),
  ...listenerSets(g).flatMap(ls => (spec(ls).listeners || []).map(l => ({l, via: ls})))];
// where a route attaches, directly or through a listener set: [{gw, via, section}]
// A route can also hang under another route (delegation): by naming it as its
// parent, or by being a backend of one of its rules. Those carry viaRoute.
function parentsOf(r, seen = new Set()) {
  if (seen.has(r.id)) return [];
  seen.add(r.id);
  const ups = [...outE(r.id).filter(e => e.type === "parent").map(e => ({p: N.get(e.to), section: e.section || "", port: (get(r.obj, e.path || "") || {}).port})),
    ...inE(r.id).filter(e => e.type === "backend" && N.get(e.from).role === "route").map(e => ({p: N.get(e.from), section: ""}))];
  return ups.flatMap(({p, section, port}) => {
    if (p.role === "gateway") return [{gw: p, via: null, section, port}];
    if (p.role === "route") return parentsOf(p, seen).map(x => ({...x, viaRoute: p}));
    if (p.role !== "listenerset") return [];
    const up = outE(p.id).find(x => x.type === "parent" && N.get(x.to).role === "gateway");
    return up ? [{gw: N.get(up.to), via: p, section, port}] : [];
  });
}
const isChildRoute = r => outE(r.id).some(e => e.type === "parent" && N.get(e.to).role === "route") || inE(r.id).some(e => e.type === "backend" && N.get(e.from).role === "route");
// Services a route is attached to: mesh traffic addressed to that Service
const serviceParents = r => outE(r.id).filter(e => e.type === "parent" && N.get(e.to).kind === "Service").map(e => N.get(e.to));
// Whether a listener takes a route that names its gateway or listener set as parent:

// namespaces are not captured: such a listener is shown with every route.
const ROUTE_PROTOCOLS = {HTTPRoute: ["HTTP", "HTTPS"], GRPCRoute: ["HTTP", "HTTPS"], TLSRoute: ["TLS"], TCPRoute: ["TCP"], UDPRoute: ["UDP"]};
// Two hostnames overlap when they are equal or one is a wildcard that covers the other.
const hostsOverlap = (a, b) => a === b || (a.startsWith("*.") && b.endsWith(a.slice(1))) || (b.startsWith("*.") && a.endsWith(b.slice(1)));

  const l = le.l, allowed = l.allowedRoutes || {}, hosts = spec(r).hostnames || [];
  if (p.section && p.section !== l.name) return false;
  if (p.port && p.port !== l.port) return false;
  if (l.hostname && hosts.length && !hosts.some(h => hostsOverlap(l.hostname, h))) return false;
  if ((allowed.kinds || []).length) { if (!allowed.kinds.some(k => k.kind === r.kind)) return false; }
  else if (ROUTE_PROTOCOLS[r.kind] && ["HTTP", "HTTPS", "TLS", "TCP", "UDP"].includes(l.protocol) && !ROUTE_PROTOCOLS[r.kind].includes(l.protocol)) return false;
  return ((allowed.namespaces || {}).from || "Same") !== "Same" || r.ns === owner.ns;
}
const routesOf = (g, le) => routes.filter(r => parentsOf(r).some(p => !p.viaRoute && p.gw === g && p.via === le.via && accepts(le, le.via || g, r, p)));
// The proxy Service of a gateway carries the gateway's name, so a backend that
// is such a Service means the request continues at that gateway.
const gatewayBehind = o => o.kind === "Service" ? gateways.find(g => g.name === o.name && g.ns === o.ns) : null;
// backends of a route per rule: Map(ruleIndex -> [{b, weight, e}])
function ruleBackends(r) {
  const m = new Map();
  for (const e of outE(r.id)) {
    const x = e.type === "backend" && /rules\.(\d+)\.backendRefs\.(\d+)$/.exec(e.path || "");
    if (!x) continue; // a backendRef inside a filter (mirror) is shown with the filter
    const ref = get(spec(r), `rules.${x[1]}.backendRefs.${x[2]}`);
    push(m, +x[1], {b: N.get(e.to), weight: ref && ref.weight, e, ref, at: `spec.rules.${x[1]}.backendRefs.${x[2]}`});
  }

  for (const e of inE(r.id)) {
    const b = N.get(e.from);
    if (e.type !== "parent" || b.role !== "backend") continue;

  }
  return m;
}
// upstream targets of a backend, read from its spec: [{name, where, proto}]
function targetsOf(b) {
  const s = spec(b), out = [];
  const st = t => t.static || t;
  const host = t => { const x = st(t); return x.backendRef ? `Service/${x.backendRef.name}${x.port ? ":" + x.port : ""}${x.path || ""}`
    : `${x.host || x.unixPath || ""}${x.port ? ":" + x.port : ""}${x.path || ""}`; };
  for (const k of ["mcp", "entMcp"]) for (const t of (s[k] && s[k].targets) || [])
    out.push({name: t.name, where: t.selector ? "services selected by label" : host(t), proto: (t.static && t.static.protocol) || "MCP"});
  if (s.ai) {
    const provs = s.ai.provider ? [s.ai.provider] : (s.ai.groups || []).flatMap((g, i) => (g.providers || []).map(p => ({...p, _group: i + 1})));
    for (const p of provs) { const k = Object.keys(p).find(x => p[x] && typeof p[x] === "object" && x !== "policies") || "provider";
      out.push({name: p.name || k, where: [k, p[k] && p[k].model, p[k] && p[k].region, p.host].filter(Boolean).join(" · "), proto: p._group ? `LLM · priority ${p._group}` : "LLM"}); }
  }
  if (s.static) out.push({name: "static", where: host(s.static), proto: "HTTP"});
  if (s.a2a) out.push({name: "a2a", where: host(s.a2a), proto: "A2A"});
  for (const [k, v] of Object.entries(s.aws || {})) // agentCore: runtime ARN, region, account
    out.push({name: k, where: Object.entries(v || {}).filter(x => typeof x[1] !== "object").map(x => `${x[0]}=${x[1]}`).join(" · "), proto: "AWS"});

    const sel = Object.entries(get(s, "selector.matchLabels") || s.selector || {}).filter(x => typeof x[1] === "string").map(x => x.join("=")).join(","), pick = s.endpointPickerRef || s.extensionRef;
    out.push({name: "pods", where: `${sel || "all pods"} :${(s.targetPorts || []).map(p => p.number).join(",") || s.targetPortNumber || ""}`, proto: "selected by label"});
    if (pick) out.push({name: "endpoint picker", where: `Service/${pick.name}${pick.port ? ":" + (pick.port.number || pick.port) : pick.portNumber ? ":" + pick.portNumber : ""}`, proto: "chooses the pod per request"});
  }

    out.push({name: s.type || "target", where: `${get(s, "externalHostname.hostname") || "pods " + sel}${s.port && s.port.number ? ":" + s.port.number : ""}`, proto: s.protocol || "backend"});

const matchText = m => {

      h += `<tr class="grp"><td colspan="6">${esc(f.kind)}<span class="mono">${esc(f.group || "core")}${f.version ? "/" + esc(f.version) : ""}</span><span>${rows.length}${f.external ? " · only referred to, not captured" : ""}</span></td></tr>`;
      h += rows.map(n => `<tr data-open="${esc(n.id)}"><td><b>${esc(n.name)}</b></td><td class="mut">${esc(n.ns || "—")}</td>
        <td>${[...new Set((n.features || []).map(x => x.cat))].map(c => tag({cat: c})).join(" ")}</td><td>${status(n)}</td>
        <td class="num">${outE(n.id).length || ""}</td><td class="num">${inE(n.id).length || ""}</td></tr>`).join("");
    }
    body.innerHTML = h || `<tr><td colspan="6" class="empty">Nothing matches</td></tr>`;
  };
  return paint;
}

/* ---------- raw ---------- */
// every captured object as one multi-document YAML text
function viewRaw(root) {
  const objs = D.nodes.filter(n => n.obj), tmp = document.createElement("div");
  const text = n => { tmp.innerHTML = yaml(n.obj, 0); return tmp.textContent; }; // yaml() returns HTML; this is its plain text
  root.innerHTML = `<div class="rawbar"><span class="mut" id="rawcount"></span><button class="btn" id="rawcopy">Copy</button></div><pre id="rawtext"></pre>`;
  const pre = root.querySelector("#rawtext"), count = root.querySelector("#rawcount");
  const paint = q => {
    const list = objs.filter(n => !q || hay(n).includes(q));
    pre.textContent = list.map(n => `---\n${text(n)}\n`).join("");
    count.textContent = `${list.length} of ${objs.length} objects${D.meta.anonymized ? ", anonymized" : ", real values"}`;
  };
  root.querySelector("#rawcopy").addEventListener("click", () => navigator.clipboard.writeText(pre.textContent));
  return paint;
}

/* ---------- detail drawer ---------- */
const drawer = $("drawer");
function openDetail(id) {
  const n = N.get(id);
  if (!n) return;
  const rel = (e, other, dir) => { const o = N.get(other); return `<div class="rel" data-open="${esc(o.id)}"><span class="ty">${dir} ${esc(e.type)}</span>
    <span><span class="k">${esc(o.kind)}</span> ${esc(o.ns ? o.ns + "/" : "")}${esc(o.name)}${e.section ? ` <span class="k">#${esc(e.section)}</span>` : ""}${o.external ? ` <span class="badge">not captured</span>` : ""}</span></div>`; };
  const condHtml = conditions(n).map(c => `<div class="cond"><span class="${c.status === "True" ? "ok" : "no"}">${c.status === "True" ? "✓" : "✗"}</span> ${esc(c.type)} <span class="mut">${esc(c.reason || "")}${c.status !== "True" && c.message ? " · " + esc(c.message) : ""}</span></div>`).join("");
  drawer.style.cssText = rc(n);
  drawer.innerHTML = `<div class="dh"><button class="x" title="Close">×</button><span class="st">${esc(n.group ? n.group + "/" : "")}${esc(n.version || "")} ${esc(n.kind)}</span>
      <h2>${esc(n.name)}</h2><span class="mut">${esc(n.ns || "cluster-scoped")}</span></div>
    <div class="db">
      ${n.external ? `<p class="mut">This object is only referred to. agwmap does not capture ${esc(n.kind)} objects, so it may or may not exist.</p>` : ""}
      ${(n.features || []).length ? `<h3>Configures</h3><div class="feats">${n.features.map(f => `<span>${tag(f)} <span class="mono">${esc(f.key)}</span></span>`).join("")}</div>` : ""}
      ${outE(id).length ? `<h3>Refers to</h3>${outE(id).map(e => rel(e, e.to, "→")).join("")}` : ""}
      ${inE(id).length ? `<h3>Referred to by</h3>${inE(id).map(e => rel(e, e.from, "←")).join("")}` : ""}
      ${condHtml ? `<h3>Status</h3>${condHtml}` : ""}
      ${n.obj ? `<h3>YAML <button class="copy">copy</button></h3><pre>${yaml(n.obj, 0)}</pre>` : ""}
    </div>`;
  drawer.classList.add("on");
}
drawer.addEventListener("click", e => {
  if (e.target.closest(".x")) drawer.classList.remove("on");
  if (e.target.closest(".copy")) navigator.clipboard.writeText(drawer.querySelector("pre").textContent);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") drawer.classList.remove("on"); });
document.addEventListener("click", e => {
  if (e.target.closest("summary") || String(getSelection())) return; // expanding or selecting text is not a click on the card
  const el = e.target.closest("[data-open]");
  if (el) openDetail(el.dataset.open);
  else if (!e.target.closest("#drawer")) drawer.classList.remove("on");
});

/* ---------- shell ---------- */
let applyFilter = () => {};
const qEl = $("q"), curQ = () => qEl.value.trim().toLowerCase();
const VIEWS = {flow: viewFlow, resources: viewResources, outside: viewOutside, raw: viewRaw};
document.querySelector('#tabs [data-v="outside"]').textContent += ` (${outside.length})`;
function render() {
  const v = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "flow";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  applyFilter = VIEWS[v]($("view")); // each view returns the function that repaints it for a filter text
  applyFilter(curQ());
}
$("tabs").addEventListener("click", e => { if (e.target.dataset.v) location.hash = e.target.dataset.v; });
window.addEventListener("hashchange", render);
qEl.addEventListener("input", () => applyFilter(curQ()));
$("export").addEventListener("click", () => {
  const snap = {kind: "agwmap-snapshot", meta: D.meta, objects: D.nodes.filter(n => n.obj).map(n => n.obj)};
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(snap, null, 1)], {type: "application/json"}));
  a.download = `agwmap-snapshot-${D.meta.generatedAt.replace(/[:]/g, "").slice(0, 15)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$("meta").textContent = `${D.meta.context}${D.meta.namespace ? " · ns " + D.meta.namespace : ""} · ${D.nodes.filter(n => !n.external).length} objects · captured ${new Date(D.meta.generatedAt).toLocaleString()}`;
const st = $("state");
st.textContent = D.meta.anonymized ? "anonymized" : "real values";
st.classList.toggle("raw", !D.meta.anonymized);
st.title = D.meta.anonymized
  ? "Hostnames, URLs, IP addresses, account and client ids and inline credentials were replaced with pseudonyms when this was captured. Of the metadata only name, namespace and gateway labels and annotations are kept. The Raw tab shows exactly what the capture holds."
  : "Captured with -anonymize=false: this page and its export hold the real hostnames and values.";
$("warn").innerHTML = (D.meta.warnings || []).length ? `<div class="warn"><b>Incomplete capture:</b><br>${D.meta.warnings.map(esc).join("<br>")}</div>` : "";
render();
</script>
</body>
</html>
