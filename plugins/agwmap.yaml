apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: agwmap
spec:
  version: v0.2.0
  homepage: https://github.com/paurosello/agwmap
  shortDescription: Map a cluster's gateway configuration in one HTML page
  description: |
    Reads the Gateway API and agentgateway objects of a cluster and writes one
    self-contained HTML page with the request flow of every route: listener,
    policies at each level, route, backends and upstream targets.
    Captures are anonymized by default and can be exported and rendered again.

      kubectl agwmap                       # current context, opened in the browser
      kubectl agwmap -n team-a -o a.html
      kubectl agwmap -from snapshot.yaml
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.2.0/agwmap_darwin_arm64.tar.gz
    sha256: f151a9dbf5afafc5bf2a92501fff9e39fe7c74fb25a5d5d09083c9762129d38b
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.2.0/agwmap_darwin_amd64.tar.gz
    sha256: 28480d5c3e3186ad3f7c9dda43ef575a7700ed64ff95588792c2800553dad2b2
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.2.0/agwmap_linux_amd64.tar.gz
    sha256: c68458f627b464cf40221902773b8d0dbde861ba405791a3bca38fe812b8570f
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.2.0/agwmap_linux_arm64.tar.gz
    sha256: aa5af480068f5410c7fab2363bf43bbb045b977f5c85f6b34320e7c47f56f8df
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.2.0/agwmap_windows_amd64.tar.gz
    sha256: 38a05092b54c9c3b26a30f523c05eeb5ea84dd808d13ac5720a69051d76583a1
    bin: kubectl-agwmap.exe
