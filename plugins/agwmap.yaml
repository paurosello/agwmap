apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: agwmap
spec:
  version: v0.3.0
  homepage: https://github.com/paurosello/agwmap
  shortDescription: Map a cluster's gateway configuration in one HTML page
  description: |
    Reads the Gateway API and agentgateway objects of a cluster and writes one
    self-contained HTML page with the request flow of every route: listener,
    policies at each level, route, backends and upstream targets.
    Captures are anonymized by default and can be exported and rendered again.

      kubectl agwmap                       # current context, opened in the browser
      kubectl agwmap -n team-a -o a.html
      kubectl agwmap -from snapshot.yaml
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.3.0/agwmap_darwin_arm64.tar.gz
    sha256: 8c2f8233401f292b75598e39a1dd8f481d201743b5a304950f1bb75aec618232
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.3.0/agwmap_darwin_amd64.tar.gz
    sha256: c89b1f7038675edeb902095f7150cf6687ca0d21c0c72f7452fd098ab332db12
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.3.0/agwmap_linux_amd64.tar.gz
    sha256: 02c9ebe6b5e7d1adff5da6c41a8e069c1f32ce96023bd9c856dc65c90b9d6a73
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.3.0/agwmap_linux_arm64.tar.gz
    sha256: efe5c0685d6dc3e38795aec476ea41bc252acb13433e815fea3a686b4ebd1fc4
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.3.0/agwmap_windows_amd64.tar.gz
    sha256: cd98cc6a72c83747a71b9054f294553853027ad9cee9224a0946ef53f080a89e
    bin: kubectl-agwmap.exe
