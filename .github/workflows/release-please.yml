name: release-please

# Keeps a "chore(main): release X.Y.Z" pull request open with the next version
# and its CHANGELOG.md section, worked out from the Conventional Commits merged
# since the last release. Merging that pull request tags the release, and the
# release workflow then builds and attaches the archives and updates krew.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # A tag pushed with the workflow token does not start other workflows, so the
  # release workflow is called here instead of waiting for the tag.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
