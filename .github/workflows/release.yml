name: release

# A tag like v0.1.0 builds the kubectl plugin archives, publishes them as a
# GitHub release, and updates plugins/agwmap.yaml on main so that krew installs
# the new version. The job can be run again for the same tag: every step either
# repeats safely or is skipped when its work is already there.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" HEAD

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test, then build archives and the krew manifest
        run: |
          git checkout --quiet "${GITHUB_SHA}"
          go vet ./...
          go test ./...
          scripts/release.sh "${GITHUB_REF_NAME}"
          cp plugins/agwmap.yaml "${RUNNER_TEMP}/agwmap.yaml"
          # Back to main with a clean tree; dist/ is ignored and stays.
          git reset --hard --quiet
          git clean -fdq plugins
          git checkout --quiet main

      - name: Release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ || /^\[[^]]+\]: / {on=0} on' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          test -s "${RUNNER_TEMP}/notes.md" || echo "Release ${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

      # The manifest holds the checksums of the archives above, so it can only
      # be committed after them. main may have moved in the meantime.
      - name: Point krew at the new version
        run: |
          git pull --quiet --rebase origin main
          mkdir -p plugins
          cp "${RUNNER_TEMP}/agwmap.yaml" plugins/agwmap.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/agwmap.yaml
          git diff --cached --quiet || git commit -m "Update the krew manifest to ${GITHUB_REF_NAME}"
          git push origin main
