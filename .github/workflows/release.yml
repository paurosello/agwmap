name: release

# A tag like v0.1.0 builds the kubectl plugin archives, attaches them to the
# GitHub release (creating it when release-please has not), and opens a pull
# request that updates plugins/agwmap.yaml so that krew installs the new version.
# release-please calls it after tagging; a tag pushed by hand starts it too.
# The job can be run again for the same tag: every step either repeats safely
# or is skipped when its work is already there.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # Runs the current workflow again for a release that was already tagged.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$(git rev-list -n 1 "${TAG}")" HEAD

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test, then build archives and the krew manifest
        run: |
          git checkout --quiet "${TAG}"
          go vet ./...
          go test ./...
          scripts/release.sh "${TAG}"
          cp plugins/agwmap.yaml "${RUNNER_TEMP}/agwmap.yaml"
          # Back to main with a clean tree; dist/ is ignored and stays.
          git reset --hard --quiet
          git clean -fdq plugins
          git checkout --quiet main

      - name: Release notes from the changelog
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ || /^\[[^]]+\]: / {on=0} on' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          test -s "${RUNNER_TEMP}/notes.md" || echo "Release ${TAG}" > "${RUNNER_TEMP}/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.tar.gz --clobber
          else
            gh release create "${TAG}" dist/*.tar.gz --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

      # The manifest holds the checksums of the archives above, so it can only
      # be committed after them. main only takes pull requests, so the manifest
      # goes to the release/krew branch and a pull request that the owner
      # merges; krew sees the new version once it is merged.
      - name: Open the pull request that points krew at the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          git checkout --quiet -B release/krew origin/main
          mkdir -p plugins
          cp "${RUNNER_TEMP}/agwmap.yaml" plugins/agwmap.yaml
          git add plugins/agwmap.yaml
          if git diff --cached --quiet; then
            echo "plugins/agwmap.yaml on main is already at ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore: update the krew manifest to ${TAG}"
          git push --quiet --force origin release/krew
          title="chore: update the krew manifest to ${TAG}"
          if [ -n "$(gh pr list --head release/krew --state open --json number --jq '.[].number')" ]; then
            gh pr edit release/krew --title "$title"
          else
            gh pr create --head release/krew --base main --title "$title" \
              --body "Points krew at ${TAG}. Merge it to make \`kubectl krew upgrade agwmap\` install the new version."
          fi
