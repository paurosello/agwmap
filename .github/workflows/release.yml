name: release

# A tag like v0.1.0 builds the kubectl plugin archives, attaches them to the
# GitHub release (creating it when release-please has not), and has
# krew-release-bot open the version bump pull request on kubernetes-sigs/krew-index.
# release-please calls it after tagging; a tag pushed by hand starts it too.
# The job can be run again for the same tag: every step either repeats safely
# or is skipped when its work is already there.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # Runs the current workflow again for a release that was already tagged.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$(git rev-list -n 1 "${TAG}")" HEAD

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test, then build the archives
        run: |
          git checkout --quiet "${TAG}"
          go vet ./...
          go test ./...
          scripts/release.sh "${TAG}"
          # Back to main with a clean tree; dist/ is ignored and stays.
          git reset --hard --quiet
          git checkout --quiet main

      - name: Release notes from the changelog
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ || /^\[[^]]+\]: / {on=0} on' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          test -s "${RUNNER_TEMP}/notes.md" || echo "Release ${TAG}" > "${RUNNER_TEMP}/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.tar.gz --clobber
          else
            gh release create "${TAG}" dist/*.tar.gz --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

      # Renders .krew.yaml for the tag (checksums from the archives uploaded
      # above) and has krew-release-bot open the version bump pull request on
      # kubernetes-sigs/krew-index. The tag is passed explicitly because
      # GITHUB_REF is main when release-please calls this workflow. The image
      # is used directly: the v0.0.51 action still runs the v0.0.50 image,
      # which ignores the tag input. Last, so that a failure of the bot's
      # webhook does not skip the steps above.
      - name: Update the version in krew-index
        uses: docker://ghcr.io/rajatjindal/krew-release-bot:v0.0.51
        env:
          INPUT_KREW_PLUGIN_RELEASE_TAG: ${{ env.TAG }}
