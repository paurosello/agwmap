name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Runs the built binary against a fake API server that serves testdata/.
      - name: Test
        run: go test ./...

  # Builds the archives of every platform. Its own build cache: the one that
  # setup-go shares with the other jobs only holds their linux/amd64 builds, and
  # the release build (-trimpath) is cached apart from those anyway.
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: archives-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: archives-${{ runner.os }}-

      - name: Build the release archives
        run: scripts/release.sh v0.0.0

  # Scans the commits of the push or pull request for credentials. The fake
  # ones the anonymizer tests use are allowlisted in .gitleaks.toml.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The same binary against a real API server: kube-apiserver and etcd started
  # by kwokctl, with the Gateway API and agentgateway CRDs and testdata/demo.yaml.
  e2e:
    runs-on: ubuntu-latest
    env:
      KWOK_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The etcd and kube-apiserver binaries that kwokctl downloads.
      - uses: actions/cache@v6
        with:
          path: ~/.kwok/cache
          key: kwok-${{ runner.os }}-${{ env.KWOK_VERSION }}

      - name: Install kwokctl
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/bin/kwokctl" \
            "https://github.com/kubernetes-sigs/kwok/releases/download/${KWOK_VERSION}/kwokctl-linux-amd64"
          chmod +x "${RUNNER_TEMP}/bin/kwokctl"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: End to end
        run: scripts/e2e.sh
